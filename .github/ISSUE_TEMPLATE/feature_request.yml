name: Feature request
description: Propose a customer outcome for a future approved milestone.
title: "[Feature]: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Customer outcome
      description: Who needs this and what should they be able to do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable behavior that would make the feature complete.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and milestone
      description: Include data, platform, and approval dependencies. Do not include secrets.
