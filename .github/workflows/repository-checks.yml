name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whitespace:
    name: Committed file whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository with actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check all committed text
        shell: bash
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
